<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURF MASTER PRO - WEATHER GRAPH FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;900&family=Permanent+Marker&display=swap');
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: 'Noto Sans JP', sans-serif; background-image: radial-gradient(#bae6fd 0.5px, transparent 0.5px); background-size: 20px 20px; }

        .hero-section { 
            height: 280px; width: 100%; display: flex; flex-direction: column; 
            justify-content: flex-end; align-items: center; 
            background: linear-gradient(rgba(255,255,255,0.1), rgba(240,249,255,1)), url('1770389433670.png'); 
            background-size: cover; background-position: center; border-bottom: 4px solid #3b82f6;
            padding-bottom: 20px;
        }

        .hero-title { font-family: 'Permanent Marker', cursive; font-size: 2.8rem; color: #fff; text-shadow: 0 4px 15px rgba(0,140,255,0.8); }
        .nav-section { background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); padding: 15px 0; border-bottom: 1px solid #bae6fd; position: sticky; top: 0; z-index: 100; }
        .nav-btn { flex: none; padding: 10px 22px; margin: 0 5px; background: #e0f2fe; color: #0369a1; border-radius: 50px; font-size: 15px; font-weight: 900; }
        .nav-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .spot-card { background: #ffffff; border-radius: 35px; padding: 25px; margin-bottom: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid #e0f2fe; }
        .info-box { border-radius: 25px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; cursor: pointer; transition: 0.2s; }
        .info-box:active { transform: scale(0.95); }
        .wave-box { background: #eff6ff; border: 2px solid #dbeafe; }
        .temp-box { background: #fff7ed; border: 2px solid #ffedd5; }
        .forecast-btn { width: 48%; padding: 10px; border-radius: 15px; font-size: 11px; font-weight: 900; }
        .wave-f-btn { color: #0369a1; border-color: #3b82f6; background: #f0f9ff; }
        .temp-f-btn { color: #9a3412; border-color: #f59e0b; background: #fff7ed; }
        .facility-group { margin-top: 15px; background: #fffaf0; border-radius: 25px; padding: 20px; border: 1px solid #fef3c7; }
        .facility-item { display: flex; margin-bottom: 12px; font-size: 15px; }
        .facility-icon { color: #f59e0b; margin-right: 12px; width: 22px; }
        .facility-label { font-weight: 900; color: #0369a1; margin-right: 8px; font-size: 13px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.98); padding: 15px 10px; display: flex; overflow-x: auto; border-top: 3px solid #3b82f6; z-index: 1000; gap: 20px; }
        .nav-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #64748b; font-weight: 900; min-width: 65px; }

        /* ===== チャットCSS ===== */
        .chat-bubble {
            background: #f0f9ff;
            border-radius: 18px;
            padding: 10px 14px;
            font-size: 13px;
            position: relative;
        }
        .chat-delete {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body class="pb-40">

<!-- ===== 既存UI（そのまま） ===== -->
<div class="hero-section">
    <h1 class="hero-title">SURF MASTER</h1>
</div>

<div class="nav-section">
    <div class="flex overflow-x-auto px-5">
        <button onclick="filterArea('wakayama')" id="btn-wakayama" class="nav-btn active">和歌山</button>
        <button onclick="filterArea('mie')" id="btn-mie" class="nav-btn">三重</button>
        <button onclick="filterArea('kyoto')" id="btn-kyoto" class="nav-btn">京都</button>
        <button onclick="filterArea('osaka')" id="btn-osaka" class="nav-btn">大阪</button>
    </div>
</div>

<main id="spot-container" class="px-5 py-8 max-w-md mx-auto"></main>

<nav class="bottom-nav">
    <button onclick="useGPS()" class="nav-item"><i class="fas fa-crosshairs text-xl"></i>近く</button>
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="nav-item"><i class="fas fa-home text-xl"></i>HOME</button>
</nav>

<!-- ===== チャットUI ===== -->
<section class="max-w-md mx-auto px-4 mt-6">
    <div class="bg-white rounded-3xl shadow-lg border p-4">
        <h2 class="text-center font-black text-sky-800 text-sm mb-3">SURF CHAT</h2>
        <div id="chat-list" class="space-y-3 mb-3 max-h-64 overflow-y-auto"></div>
        <div class="flex gap-2">
            <input id="chat-text" class="flex-1 rounded-full px-4 py-2 border text-sm" placeholder="メッセージ">
            <input id="chat-image" type="file" accept="image/*" class="hidden">
            <button onclick="selectImage()" class="text-xl text-sky-500"><i class="fas fa-image"></i></button>
            <button onclick="sendChat()" class="bg-sky-500 text-white rounded-full px-4 font-black">送信</button>
        </div>
    </div>
</section>

<script>
/* ===== チャットJS ===== */
let chats = JSON.parse(localStorage.getItem('surfChats')) || [];

function saveChats() {
    localStorage.setItem('surfChats', JSON.stringify(chats));
}

function renderChats() {
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    chats.forEach((c, i) => {
        const d = document.createElement('div');
        d.className = 'chat-bubble';
        d.innerHTML = `
            ${c.text ? `<p>${c.text}</p>` : ''}
            ${c.image ? `<img src="${c.image}" class="mt-2 rounded-xl max-h-40">` : ''}
            <button class="chat-delete" onclick="deleteChat(${i})">×</button>
        `;
        list.appendChild(d);
    });
    list.scrollTop = list.scrollHeight;
}

function sendChat() {
    const text = chat-text.value.trim();
    const file = chat-image.files[0];
    if (!text && !file) return;

    if (file) {
        const r = new FileReader();
        r.onload = () => {
            chats.push({ text, image: r.result });
            saveChats(); renderChats();
        };
        r.readAsDataURL(file);
    } else {
        chats.push({ text });
        saveChats(); renderChats();
    }
    chat-text.value = '';
    chat-image.value = '';
}

function deleteChat(i) {
    chats.splice(i, 1);
    saveChats(); renderChats();
}

function selectImage() {
    chat-image.click();
}

renderChats();
</script>

</body>
</html>
