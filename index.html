<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURF MASTER PRO - FULL DATA + CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;900&family=Permanent+Marker&display=swap');
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: 'Noto Sans JP', sans-serif; background-image: radial-gradient(#bae6fd 0.5px, transparent 0.5px); background-size: 20px 20px; }
        
        .hero-section { 
            height: 280px; width: 100%; display: flex; flex-direction: column; 
            justify-content: flex-end; align-items: center; 
            background: linear-gradient(rgba(255,255,255,0.1), rgba(240,249,255,1)), url('1770389433670.png'); 
            background-size: cover; background-position: center; border-bottom: 4px solid #3b82f6;
            padding-bottom: 20px;
        }
        
        .hero-title { font-family: 'Permanent Marker', cursive; font-size: 2.8rem; color: #fff; text-shadow: 0 4px 15px rgba(0,140,255,0.8); }
        .nav-section { background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); padding: 15px 0; border-bottom: 1px solid #bae6fd; position: sticky; top: 0; z-index: 100; }
        .nav-btn { flex: none; padding: 10px 22px; margin: 0 5px; background: #e0f2fe; color: #0369a1; border-radius: 50px; font-size: 15px; font-weight: 900; }
        .nav-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        
        .spot-card { background: #ffffff; border-radius: 35px; padding: 25px; margin-bottom: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid #e0f2fe; position: relative; overflow: hidden; }
        .info-box { border-radius: 25px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; cursor: pointer; transition: 0.2s; }
        .wave-box { background: #eff6ff; border: 2px solid #dbeafe; }
        .temp-box { background: #fff7ed; border: 2px solid #ffedd5; }
        .forecast-btn { width: 48%; padding: 10px; border-radius: 15px; font-size: 11px; font-weight: 900; text-align: center; border: 1px solid; }
        .facility-group { margin-top: 15px; background: #fffaf0; border-radius: 25px; padding: 20px; border: 1px solid #fef3c7; }
        .facility-item { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 15px; line-height: 1.5; color: #334155; }
        .facility-icon { color: #f59e0b; margin-right: 12px; width: 22px; text-align: center; }
        .facility-label { font-weight: 900; color: #0369a1; margin-right: 8px; font-size: 13px; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px 10px; display: flex; overflow-x: auto; border-top: 3px solid #3b82f6; z-index: 1000; gap: 20px; }
        .nav-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #64748b; font-weight: 900; min-width: 65px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* チャットスタイル */
        #chat-section { background: white; border-radius: 35px; padding: 25px; margin-top: 20px; margin-bottom: 120px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 2px solid #3b82f6; }
        .chat-display { height: 200px; overflow-y: auto; background: #f8fafc; border-radius: 20px; padding: 15px; margin-bottom: 15px; border: 1px inset #e2e8f0; display: flex; flex-direction: column; }
        .chat-msg { background: white; padding: 8px 12px; border-radius: 15px; margin-bottom: 8px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #3b82f6; align-self: flex-start; }
        .chat-input-group { display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px; border-radius: 15px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
        .chat-send { background: #3b82f6; color: white; padding: 10px 15px; border-radius: 15px; font-weight: 900; }
    </style>
</head>
<body class="pb-40">
    <div class="hero-section"><h1 class="hero-title">SURF MASTER</h1></div>

    <div class="nav-section">
        <div class="flex overflow-x-auto no-scrollbar px-5">
            <button onclick="filterArea('wakayama')" id="btn-wakayama" class="nav-btn active">和歌山</button>
            <button onclick="filterArea('mie')" id="btn-mie" class="nav-btn">三重</button>
            <button onclick="filterArea('kyoto')" id="btn-kyoto" class="nav-btn">京都</button>
            <button onclick="filterArea('osaka')" id="btn-osaka" class="nav-btn">大阪</button>
        </div>
    </div>

    <main class="px-5 py-8 max-w-md mx-auto">
        <div id="spot-container"></div>
        <section id="chat-section">
            <div class="flex items-center mb-4">
                <i class="fas fa-comments text-blue-500 mr-2 text-xl"></i>
                <h3 class="text-xl font-black text-sky-900 italic">REALTIME CHAT</h3>
            </div>
            <div id="chat-display" class="no-scrollbar">
                <div class="chat-msg">🌊 磯ノ浦、現在セットで腰腹あります！</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chat-input" class="chat-input" placeholder="波情報を共有...">
                <button onclick="sendChat()" class="chat-send"><i class="fas fa-paper-plane"></i></button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav no-scrollbar">
        <button onclick="useGPS()" class="nav-item"><i class="fas fa-crosshairs mb-1 text-xl text-blue-500"></i><span>近くを探す</span></button>
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="nav-item"><i class="fas fa-home mb-1 text-xl"></i><span>HOME</span></button>
        <a href="https://www.google.co.jp/maps/search/サーフポイント" target="_blank" class="nav-item text-green-600"><i class="fas fa-map-marked-alt mb-1 text-xl"></i><span>マップ</span></a>
        <a href="https://www.windy.com" target="_blank" class="nav-item text-blue-400"><i class="fas fa-wind mb-1 text-xl"></i><span>風情報</span></a>
        <a href="https://tide736.net" target="_blank" class="nav-item text-cyan-500"><i class="fas fa-water mb-1 text-xl"></i><span>潮見表</span></a>
    </nav>

    <script>
        // 【全てのスポットデータを復活させました】
        const surfSpots = [
            { area: 'wakayama', name: '磯ノ浦', q: '和歌山市 天気', lat: 34.2589, lon: 135.1054, p: '巨大駐車場有(1000円〜)', s: '温水シャワー完備', t: '有', o: '通年人気。' },
            { area: 'wakayama', name: '西磯', q: '和歌山市 天気', lat: 34.2595, lon: 135.0963, p: '磯ノ浦P利用', s: '施設利用', t: '有', o: '岩場注意。' },
            { area: 'wakayama', name: '奥磯', q: '和歌山市 天気', lat: 34.2605, lon: 135.1120, p: '東P近', s: '近隣', t: '有', o: 'ルール厳守。' },
            { area: 'wakayama', name: '浜の宮', q: '和歌山市 天気', lat: 34.1738, lon: 135.1882, p: '海水浴場P', s: '夏季のみ', t: '完備', o: 'マリーナシティ目前。' },
            { area: 'wakayama', name: '淡島神社', q: '和歌山 加太 天気', lat: 34.2750, lon: 135.0645, p: '周辺', s: '無', t: '神社', o: 'リーフ。中級者以上。' },
            { area: 'wakayama', name: 'ゴロゴロ', q: '和歌山 広川町 天気', lat: 33.7225, lon: 135.3441, p: '有料P', s: '簡易有', t: '有', o: '玉石。' },
            { area: 'wakayama', name: 'モーテル下', q: '和歌山 広川町 天気', lat: 33.7188, lon: 135.3522, p: '有料P', s: 'ショップ', t: '有', o: 'カレント注意。' },
            { area: 'wakayama', name: '下里', q: '那智勝浦町 天気', lat: 33.5855, lon: 135.9185, p: 'ビーチ前', s: '夏季', t: '有', o: '水質綺麗。' },
            { area: 'wakayama', name: '那智', q: '那智勝浦町 天気', lat: 33.6385, lon: 135.9392, p: 'ビーチ横', s: '完備', t: '有', o: '道の駅近。' },
            { area: 'wakayama', name: 'フカ', q: '串本町 天気', lat: 33.5512, lon: 135.5015, p: '駐車注意', s: '無', t: '無', o: 'パワフル。' },
            { area: 'wakayama', name: '漁港(印南)', q: '印南町 天気', lat: 33.8210, lon: 135.2015, p: '漁港内', s: '無', t: '有', o: '作業優先。' },
            { area: 'mie', name: '国府の浜', q: '志摩市 天気', lat: 34.3325, lon: 136.9125, p: '民間多数', s: '各所', t: '有', o: '三重のメッカ。' },
            { area: 'mie', name: '市後浜', q: '志摩市 天気', lat: 34.3215, lon: 136.9080, p: '専用有料', s: '完備', t: '有', o: 'キャンプ場併設。' },
            { area: 'kyoto', name: '八丁浜', q: '京丹後市 天気', lat: 35.6965, lon: 135.0515, p: 'パークP', s: '完備', t: '有', o: '公園併設。' },
            { area: 'osaka', name: 'せんなん里海公園', q: '岬町 天気', lat: 34.3435, lon: 135.1855, p: '巨大P', s: '完備', t: '有', o: '台風時のみ。' }
        ];

        async function fetchSurf(lat, lon, id) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m&marine=wave_height&timezone=Asia%2FTokyo`);
                const data = await res.json();
                const wave = data.current.wave_height || 0.4;
                document.getElementById(`w-val-${id}`).innerText = wave.toFixed(1);
                document.getElementById(`t-val-${id}`).innerText = Math.round(data.current.temperature_2m) + '°C';
                document.getElementById(`wind-${id}`).innerText = Math.round(data.current.wind_speed_10m) + ' km/h';
            } catch (e) { console.error(e); }
        }

        function filterArea(area) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${area}`).classList.add('active');
            const container = document.getElementById('spot-container');
            container.innerHTML = '';
            surfSpots.filter(s => s.area === area).forEach((spot, i) => {
                const div = document.createElement('div');
                div.className = 'spot-card';
                div.innerHTML = `
                    <h3 class="text-2xl font-black italic text-sky-900 mb-4">${spot.name}</h3>
                    <div class="flex justify-between gap-4 mb-4">
                        <div class="info-box wave-box flex-1">
                            <p class="text-[11px] font-bold text-blue-500">波の高さ</p>
                            <p class="text-3xl font-black text-sky-900"><span id="w-val-${i}">--</span>m</p>
                        </div>
                        <div class="info-box temp-box flex-1">
                            <p class="text-[11px] font-bold text-orange-500">気温</p>
                            <p id="t-val-${i}" class="text-3xl font-black text-sky-900">--</p>
                        </div>
                    </div>
                    <div class="text-right text-xs font-bold text-blue-400 mb-4 uppercase">Wind: <span id="wind-${i}" class="text-sky-700">--</span></div>
                    <div class="facility-group">
                        <div class="facility-item"><i class="fas fa-parking facility-icon"></i><div><span class="facility-label">P</span>${spot.p}</div></div>
                        <div class="facility-item"><i class="fas fa-shower facility-icon"></i><div><span class="facility-label">🚿</span>${spot.s}</div></div>
                        <div class="facility-item text-xs font-bold text-sky-700 italic border-t pt-2 mt-2 border-sky-100">${spot.o}</div>
                    </div>
                `;
                container.appendChild(div);
                fetchSurf(spot.lat, spot.lon, i);
            });
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const display = document.getElementById('chat-display');
            if (input.value.trim() !== "") {
                const newMsg = document.createElement('div');
                newMsg.className = 'chat-msg';
                const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                newMsg.innerText = `[${time}] ${input.value}`;
                display.prepend(newMsg);
                input.value = "";
            }
        }
        function useGPS() { filterArea('wakayama'); }
        filterArea('wakayama');
    </script>
</body>
</html>
