<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURF MASTER PRO - STABLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;900&family=Permanent+Marker&display=swap');
        
        body { margin: 0; background: #f8fafc; color: #1e293b; font-family: 'Noto Sans JP', sans-serif; }

        /* ヒーローエリア：背景画像を確実に表示し、文字を保護 */
        .hero-section { 
            position: relative; height: 240px; width: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1502680399488-2a6574c50375?q=80&w=1200&auto=format&fit=crop'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 4px solid #3b82f6;
        }
        .hero-title { font-family: 'Permanent Marker', cursive; font-size: 3.2rem; color: #fff; text-shadow: 0 4px 12px rgba(0,0,0,0.6); margin: 0; }
        .hero-subtitle { color: #fff; font-weight: 900; font-size: 11px; letter-spacing: 0.3em; background: #3b82f6; padding: 3px 15px; border-radius: 50px; margin-top: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* 通知スイッチ：最上部に独立させて配置（絶対重ならない） */
        .top-notif-bar { 
            position: absolute; top: 10px; right: 10px; z-index: 50;
            background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 50px;
            display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 900;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 掲示板（ティッカー） */
        .status-bar { background: #1e293b; color: #fff; padding: 12px 15px; border-bottom: 2px solid #3b82f6; overflow: hidden; }
        .ticker-container { overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 900; }
        .ticker-text { display: inline-block; padding-left: 100%; animation: ticker 25s linear infinite; color: #60a5fa; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* ナビゲーション */
        .nav-section { background: #fff; padding: 15px 0; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .nav-btn { flex: none; padding: 10px 24px; margin: 0 6px; background: #f1f5f9; color: #475569; border-radius: 50px; font-size: 15px; font-weight: 900; transition: 0.3s; }
        .nav-btn.active { background: #3b82f6; color: white; transform: scale(1.05); }

        /* スポットカード */
        .spot-card { background: #fff; border-radius: 28px; padding: 22px; margin-bottom: 30px; border: 1px solid #e2e8f0; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05); }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 18px; }
        .data-item { background: #f0f9ff; padding: 15px; border-radius: 20px; text-align: center; border: 1px solid #e0f2fe; }
        
        .facility-box { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 20px; padding: 18px; margin-bottom: 18px; font-size: 14px; }
        .facility-row { display: flex; margin-bottom: 8px; align-items: center; color: #92400e; font-weight: 700; }
        .facility-row i { width: 24px; color: #d97706; margin-right: 10px; font-size: 1.1rem; }

        /* ボトムナビ */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
            border-top: 3px solid #3b82f6; z-index: 1000;
            display: grid; grid-template-columns: repeat(4, 1fr); 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; padding: 12px 0; font-size: 10px; color: #64748b; font-weight: 900; text-decoration: none; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }

        /* スイッチ用 */
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body class="pb-44">

    <header class="hero-section">
        <div class="top-notif-bar">
            <i class="fas fa-bell text-blue-500"></i> <span>通知</span>
            <label class="switch">
                <input type="checkbox" id="notif-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <h1 class="hero-title">SURF MASTER</h1>
        <div class="hero-subtitle">PREMIUM LIVE CONNECTED</div>
    </header>

    <div class="status-bar">
        <div class="ticker-container">
            <span id="news-ticker" class="ticker-text font-black">ライブデータを同期中... 最新の波高情報を取得しています...</span>
        </div>
    </div>

    <nav class="nav-section">
        <div class="flex overflow-x-auto no-scrollbar px-4">
            <button onclick="filterArea('wakayama')" id="btn-wakayama" class="nav-btn active">和歌山</button>
            <button onclick="filterArea('mie')" id="btn-mie" class="nav-btn">三重</button>
            <button onclick="filterArea('kyoto')" id="btn-kyoto" class="nav-btn">京都</button>
            <button onclick="filterArea('osaka')" id="btn-osaka" class="nav-btn">大阪</button>
        </div>
    </nav>

    <main id="spot-container" class="px-5 py-8 max-w-md mx-auto"></main>

    <nav class="bottom-nav">
        <button onclick="useGPS()" class="nav-item text-blue-500"><i class="fas fa-location-arrow"></i><span>近く</span></button>
        <a href="https://www.google.com" target="_blank" class="nav-item text-blue-600"><i class="fab fa-chrome"></i><span>Chrome</span></a>
        <button onclick="alert('トーク機能へ')" class="nav-item text-indigo-500"><i class="fas fa-comments"></i><span>トーク</span></button>
        <a href="https://www.google.co.jp/maps" target="_blank" class="nav-item text-green-600"><i class="fas fa-map-marked-alt"></i><span>マップ</span></a>
        
        <a href="https://www.windy.com" target="_blank" class="nav-item text-sky-400"><i class="fas fa-wind"></i><span>風情報</span></a>
        <a href="https://tide736.net" target="_blank" class="nav-item text-cyan-500"><i class="fas fa-water"></i><span>潮見表</span></a>
        <a href="https://nowphas.mlit.go.jp/" target="_blank" class="nav-item text-orange-600"><i class="fas fa-broadcast-tower"></i><span>ナウファス</span></a>
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="nav-item text-slate-400"><i class="fas fa-chevron-up"></i><span>TOP</span></button>
    </nav>

    <script>
        const surfSpots = [
            { area: 'wakayama', name: '磯ノ浦', q: '和歌山市 天気', lat: 34.2589, lon: 135.1054, p: 'あり(1000円〜)', s: 'あり(温水シャワー完備)', t: 'あり(公衆トイレ)', o: '関西のメイン。駐車場から海が近く便利。' },
            { area: 'wakayama', name: '西磯', q: '和歌山市 天気', lat: 34.2595, lon: 135.0963, p: '磯ノ浦Pを利用', s: '磯ノ浦の設備を利用', t: 'あり', o: 'リーフブレイク。中上級者中心のポイント。' },
            { area: 'mie', name: '国府の浜', q: '志摩市 天気', lat: 34.3325, lon: 136.9125, p: 'あり(多数)', s: 'あり(温水・更衣室)', t: 'あり', o: '三重のメイン。非常に広く、設備も充実。' },
            { area: 'kyoto', name: '八丁浜', q: '京丹後市 天気', lat: 35.6965, lon: 135.0515, p: 'あり(シーサイドパーク)', s: 'あり', t: 'あり', o: '日本海を代表するポイント。設備が整っています。' },
            { area: 'osaka', name: 'せんなん里海', q: '岬町 天気', lat: 34.3435, lon: 135.1855, p: 'あり(大規模P)', s: 'あり(公園内)', t: 'あり', o: '台風時に波が立つ貴重なポイント。公園ルール遵守。' }
        ];

        const areaNews = {
            wakayama: "【和歌山】磯ノ浦：現在セットでハラ。夕方の引きに向けてコンディション上向き。西磯はカレントに注意。",
            mie: "【三重】国府の浜：オフショアで良好。セットでムネ。全域でサーフ可能です。",
            kyoto: "【京都】八丁浜：北西の風が強くややハード。夕日ヶ浦の方が面がまとまっています。",
            osaka: "【大阪】せんなん里海：現在フラット。海水浴シーズン以外は静かな環境です。"
        };

        // 波高・気温データの取得をより安定させる
        async function fetchSurfData(lat, lon, id) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&daily=wave_height_max&timezone=Asia%2FTokyo`);
                const data = await response.json();
                
                const waveHeight = (data.daily.wave_height_max[0] || 0.4).toFixed(1);
                const temp = Math.round(data.current.temperature_2m);
                
                document.getElementById(`w-val-${id}`).innerText = waveHeight;
                document.getElementById(`t-val-${id}`).innerText = temp + '°C';
            } catch (error) {
                // 万が一エラーの場合はデフォルト値を表示
                document.getElementById(`w-val-${id}`).innerText = "0.5";
                document.getElementById(`t-val-${id}`).innerText = "20°C";
            }
        }

        function filterArea(area) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${area}`).classList.add('active');
            
            document.getElementById('news-ticker').innerText = areaNews[area];
            
            const container = document.getElementById('spot-container');
            container.innerHTML = '';

            surfSpots.filter(s => s.area === area).forEach((spot, i) => {
                const div = document.createElement('div');
                div.className = 'spot-card';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-5">
                        <h3 class="text-2xl font-black italic text-slate-800">${spot.name}</h3>
                        <span class="bg-blue-600 text-white text-[9px] px-2 py-1 rounded font-black">LIVE</span>
                    </div>

                    <div class="data-grid">
                        <div class="data-item">
                            <p class="text-[10px] font-black text-blue-500 mb-1 uppercase tracking-tighter">Wave Height</p>
                            <p class="text-3xl font-black text-slate-800"><span id="w-val-${i}">--</span><span class="text-sm ml-1">m</span></p>
                        </div>
                        <div class="data-item">
                            <p class="text-[10px] font-black text-orange-500 mb-1 uppercase tracking-tighter">Temperature</p>
                            <p id="t-val-${i}" class="text-3xl font-black text-slate-800">--</p>
                        </div>
                    </div>
                    
                    <div class="facility-box">
                        <div class="facility-row"><i class="fas fa-parking"></i> <span>駐車場:</span> <span class="ml-2 font-normal">${spot.p}</span></div>
                        <div class="facility-row"><i class="fas fa-shower"></i> <span>シャワー:</span> <span class="ml-2 font-normal">${spot.s}</span></div>
                        <div class="facility-row"><i class="fas fa-restroom"></i> <span>トイレ:</span> <span class="ml-2 font-normal">${spot.t}</span></div>
                        <p class="mt-4 pt-4 border-t border-amber-200 text-slate-600 font-bold text-[11px] leading-relaxed italic">${spot.o}</p>
                    </div>

                    <div class="flex gap-3">
                        <a href="https://www.google.co.jp/maps/search/${encodeURIComponent(spot.name + " サーフィン")}" target="_blank" class="flex-1 bg-emerald-600 text-white py-4 rounded-2xl text-center text-[11px] font-black shadow-lg shadow-emerald-100">マップを見る</a>
                        <a href="https://www.google.com/search?q=${encodeURIComponent(spot.q)}" target="_blank" class="flex-1 bg-white border-2 border-slate-200 text-slate-700 py-4 rounded-2xl text-center text-[11px] font-black">詳細天気</a>
                    </div>
                `;
                container.appendChild(div);
                fetchSurfData(spot.lat, spot.lon, i);
            });
        }

        function useGPS() {
            navigator.geolocation.getCurrentPosition((p) => {
                const la = p.coords.latitude;
                if(la > 35) filterArea('kyoto'); else if(la > 34.3) filterArea('osaka'); else if(la > 34.1) filterArea('wakayama'); else filterArea('mie');
            });
        }

        filterArea('wakayama');
    </script>
</body>
</html>
