<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURF MASTER PRO - LIVE EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;900&family=Permanent+Marker&display=swap');
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: 'Noto Sans JP', sans-serif; background-image: radial-gradient(#bae6fd 0.5px, transparent 0.5px); background-size: 20px 20px; }
        
        /* 伝統のヒーローエリア */
        .hero-section { 
            height: 280px; width: 100%; display: flex; flex-direction: column; 
            justify-content: flex-end; align-items: center; 
            background: linear-gradient(rgba(255,255,255,0.1), rgba(240,249,255,1)), url('1770389433670.png'); 
            background-size: cover; background-position: center; border-bottom: 4px solid #3b82f6; padding-bottom: 20px;
        }
        .hero-title { font-family: 'Permanent Marker', cursive; font-size: 2.8rem; color: #fff; text-shadow: 0 4px 15px rgba(0,140,255,0.8); }
        
        /* ニュースティッカー */
        .ticker-wrap { background: #1e293b; color: #3b82f6; padding: 8px 0; overflow: hidden; font-weight: 900; font-size: 12px; border-bottom: 2px solid #3b82f6; }
        .ticker { display: inline-block; white-space: nowrap; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .nav-section { background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); padding: 15px 0; border-bottom: 1px solid #bae6fd; position: sticky; top: 0; z-index: 100; }
        .nav-btn { flex: none; padding: 10px 22px; margin: 0 5px; background: #e0f2fe; color: #0369a1; border-radius: 50px; font-size: 15px; font-weight: 900; }
        .nav-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        
        .spot-card { background: #ffffff; border-radius: 35px; padding: 25px; margin-bottom: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid #e0f2fe; position: relative; }

        /* チャット＆通知UI */
        #chat-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; flex-direction: column; }
        .chat-msg { padding: 12px 16px; border-radius: 22px; margin-bottom: 10px; max-width: 85%; font-size: 14px; position: relative; }
        .msg-me { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-other { background: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .notification-toast { position: fixed; top: 20px; left: 10px; right: 10px; background: rgba(30, 41, 59, 0.95); color: white; padding: 15px; border-radius: 20px; z-index: 3000; display: none; transform: translateY(-100px); transition: 0.5s; border-left: 5px solid #3b82f6; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        .msg-menu { position: absolute; background: rgba(0,0,0,0.85); color: white; border-radius: 12px; padding: 8px; display: none; z-index: 2100; font-size: 12px; }
        
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(255, 255, 255, 0.98); 
            padding: 10px 5px env(safe-area-inset-bottom);
            border-top: 3px solid #3b82f6; z-index: 1000; 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 0;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #64748b; font-weight: 900; border: none; background: none; }
    </style>
</head>
<body class="pb-48">
    <div id="toast" class="notification-toast flex items-center gap-3">
        <i class="fas fa-bell text-blue-400 text-xl"></i>
        <div>
            <p id="toast-title" class="font-black text-sm"></p>
            <p id="toast-body" class="text-xs opacity-80"></p>
        </div>
    </div>

    <div class="hero-section">
        <h1 class="hero-title">SURF MASTER</h1>
        <div class="bg-white/80 px-4 py-1 rounded-full text-blue-600 font-black text-xs tracking-widest mt-2 shadow-sm">LIVE FEED & SMART TALK</div>
    </div>

    <div class="ticker-wrap">
        <div class="ticker">
            【速報】磯ノ浦：ウネリ反応開始。潮が動き出す14時以降が狙い目... 
            【三重】国府の浜：オフショア、コンディション安定中... 
            【京都】夕日ヶ浦：冬の日本海らしいクリーンなウネリが入荷...
        </div>
    </div>

    <div class="nav-section">
        <div class="flex overflow-x-auto no-scrollbar px-5">
            <button onclick="filterArea('wakayama')" id="btn-wakayama" class="nav-btn active">和歌山</button>
            <button onclick="filterArea('mie')" id="btn-mie" class="nav-btn">三重</button>
            <button onclick="filterArea('kyoto')" id="btn-kyoto" class="nav-btn">京都</button>
            <button onclick="filterArea('osaka')" id="btn-osaka" class="nav-btn">大阪</button>
        </div>
    </div>

    <main id="spot-container" class="px-5 py-8 max-w-md mx-auto"></main>

    <div id="chat-overlay">
        <div class="p-5 flex justify-between items-center bg-blue-600 text-white shadow-md">
            <div>
                <h2 class="font-black italic text-xl">SURFERS TALK</h2>
                <p class="text-[9px] opacity-80">長押しで取り消し・共有</p>
            </div>
            <button onclick="toggleChat()" class="text-2xl font-black px-2">×</button>
        </div>
        <div id="chat-content" class="flex-1 overflow-y-auto p-5 flex flex-col">
            <div class="chat-msg msg-other">磯ノ浦は今サイズアップしてきました！ 🌊</div>
        </div>
        
        <div class="p-4 border-t bg-slate-50 flex items-center gap-2 pb-10">
            <label class="text-slate-400 px-2 cursor-pointer active:text-blue-600">
                <i class="fas fa-camera text-xl"></i>
                <input type="file" accept="image/*" class="hidden" onchange="sendPhoto(this)">
            </label>
            <input type="text" id="chat-input" placeholder="メッセージ..." class="flex-1 border rounded-full px-4 py-2 outline-none">
            <button onclick="sendMessage()" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="msg-context-menu" class="msg-menu">
        <button class="block w-full text-left px-4 py-2" onclick="deleteMsg()">取り消し</button>
        <button class="block w-full text-left px-4 py-2" onclick="shareMsg()">共有</button>
    </div>

    <nav class="bottom-nav">
        <button onclick="useGPS()" class="nav-item text-blue-500"><i class="fas fa-crosshairs text-xl mb-1"></i><span>近くを探す</span></button>
        <a href="https://www.google.com" target="_blank" class="nav-item text-blue-600"><i class="fab fa-chrome text-xl mb-1"></i><span>Chrome</span></a>
        <button onclick="toggleChat()" class="nav-item text-indigo-500"><i class="fas fa-comments text-xl mb-1"></i><span>トーク</span></button>
        <a href="https://www.google.co.jp/maps/search/サーフポイント" target="_blank" class="nav-item text-green-600"><i class="fas fa-map-marked-alt text-xl mb-1"></i><span>マップ</span></a>
        <a href="https://www.windy.com" target="_blank" class="nav-item text-blue-400"><i class="fas fa-wind text-xl mb-1"></i><span>風情報</span></a>
        <a href="https://tide736.net" target="_blank" class="nav-item text-cyan-500"><i class="fas fa-water text-xl mb-1"></i><span>潮見表</span></a>
        <a href="https://www.mlit.go.jp/kowan/nowphas/" target="_blank" class="nav-item text-orange-500"><i class="fas fa-broadcast-tower text-xl mb-1"></i><span>ナウファス</span></a>
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="nav-item text-slate-400"><i class="fas fa-arrow-up text-xl mb-1"></i><span>TOP</span></button>
    </nav>

    <script>
        const surfSpots = [
            { area: 'wakayama', name: '磯ノ浦', q: '和歌山市 天気', lat: 34.2589, lon: 135.1054, p: '巨大駐車場有(1000円〜)', s: '温水シャワー・更衣室完備', t: '公衆トイレ有', o: '関西のメッカ。' },
            { area: 'wakayama', name: '西磯', q: '和歌山市 天気', lat: 34.2595, lon: 135.0963, p: '磯ノ浦駐車場を利用', s: '磯ノ浦の設備を利用', t: '公衆トイレ有', o: 'リーフ主体の中上級者。' },
            { area: 'wakayama', name: '奥磯', q: '和歌山市 天気', lat: 34.2605, lon: 135.1120, p: '東側駐車場が近い', s: '有', t: '有', o: 'メイン混雑時の回避用。' },
            { area: 'wakayama', name: '浜の宮', q: '和歌山市 天気', lat: 34.1738, lon: 135.1882, p: '海水浴場駐車場', s: '有', t: '有', o: '初心者向きビーチ。' },
            { area: 'wakayama', name: '淡島神社', q: '和歌山 加太 天気', lat: 34.2750, lon: 135.0645, p: '神社付近', s: '無', t: '有', o: 'パワフルなリーフ。' },
            { area: 'wakayama', name: 'ゴロゴロ', q: '和歌山 広川町 天気', lat: 33.7225, lon: 135.3441, p: '有料P', s: '有', t: '有', o: '玉石、中級者。' },
            { area: 'wakayama', name: 'モーテル下', q: '和歌山 広川町 天気', lat: 33.7188, lon: 135.3522, p: '有料P', s: '有', t: '有', o: '白浜手前のメジャースポット。' },
            { area: 'wakayama', name: '下里', q: '那智勝浦町 天気', lat: 33.5855, lon: 135.9185, p: 'ビーチ前', s: '有', t: '有', o: '非常に綺麗な水質。' },
            { area: 'wakayama', name: '那智', q: '那智勝浦町 天気', lat: 33.6385, lon: 135.9392, p: '駅・ビーチ横', s: '完備', t: '有', o: '道の駅隣接。' },
            { area: 'wakayama', name: 'フカ', q: '串本町 天気', lat: 33.5512, lon: 135.5015, p: '注意', s: '無', t: '無', o: 'ローカルリスペクト必須。' },
            { area: 'wakayama', name: '印南漁港', q: '印南町 天気', lat: 33.8210, lon: 135.2015, p: 'ルール遵守', s: '無', t: '有', o: '漁船優先。' },
            { area: 'mie', name: '国府の浜', q: '志摩市 天気', lat: 34.3325, lon: 136.9125, p: '多数有', s: '完備', t: '有', o: '三重のメイン。' },
            { area: 'mie', name: '市後浜', q: '志摩市 天気', lat: 34.3215, lon: 136.9080, p: '専用P', s: '完備', t: '有', o: 'キャンプ場併設。' },
            { area: 'mie', name: '阿児の松原', q: '志摩市 天気', lat: 34.3380, lon: 136.9050, p: '民間P', s: '有', t: '有', o: '静かにサーフ可能。' },
            { area: 'mie', name: '南張', q: '南張 天気', lat: 34.2885, lon: 136.7562, p: '有料P', s: '有', t: '有', o: 'ハード。上級者。' },
            { area: 'mie', name: 'ジャン', q: '志摩市 天気', lat: 34.3100, lon: 136.8800, p: '極少', s: '無', t: '無', o: 'リーフ上級者。' },
            { area: 'kyoto', name: '八丁浜', q: '京丹後市 天気', lat: 35.6965, lon: 135.0515, p: 'シーサイドパーク', s: '完備', t: '有', o: '丹後のメッカ。' },
            { area: 'kyoto', name: '夕日ヶ浦', q: '京丹後市 天気', lat: 35.6690, lon: 134.9250, p: '園地P', s: '有', t: '有', o: '冬の代表。' },
            { area: 'kyoto', name: '葛野浜', q: '京丹後市 天気', lat: 35.6420, lon: 134.9080, p: '有料P', s: '有', t: '有', o: 'ロングビーチ。' },
            { area: 'kyoto', name: '小天橋', q: '京丹後市 天気', lat: 35.6312, lon: 134.8950, p: '海水浴場P', s: '完備', t: '有', o: '安定。' },
            { area: 'kyoto', name: '神崎', q: '舞鶴市 天気', lat: 35.5350, lon: 135.2420, p: '広大', s: '有', t: '有', o: '河口、地形。' },
            { area: 'kyoto', name: '平', q: '伊根町 天気', lat: 35.7530, lon: 135.1580, p: 'キャンプ場P', s: '有', t: '有', o: '穴場。' },
            { area: 'osaka', name: 'せんなん里海', q: '岬町 天気', lat: 34.3435, lon: 135.1855, p: '巨大公立P', s: '完備', t: '有', o: '台風時のみ。' }
        ];

        let targetMsg = null;

        // 通知を表示する関数
        function showNotification(title, body) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-body').innerText = body;
            toast.style.display = 'flex';
            setTimeout(() => toast.style.transform = 'translateY(0)', 100);
            setTimeout(() => {
                toast.style.transform = 'translateY(-100px)';
                setTimeout(() => toast.style.display = 'none', 500);
            }, 5000);
        }

        // 自動通知シミュレーション（10秒後に実行）
        setTimeout(() => {
            showNotification("🌊 波情報アラート", "和歌山：磯ノ浦でサイズアップの報告あり！");
        }, 10000);

        function toggleChat() {
            const el = document.getElementById('chat-overlay');
            el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
        }

        function createMsgElement(content, isPhoto = false) {
            const msg = document.createElement('div');
            msg.className = 'chat-msg msg-me';
            if (isPhoto) {
                const img = document.createElement('img');
                img.src = content;
                img.className = 'w-full rounded-xl';
                msg.appendChild(img);
            } else {
                msg.innerText = content;
            }
            msg.oncontextmenu = (e) => showMenu(e, msg);
            msg.onclick = (e) => showMenu(e, msg);
            return msg;
        }

        function showMenu(e, msg) {
            e.preventDefault();
            targetMsg = msg;
            const menu = document.getElementById('msg-context-menu');
            menu.style.display = 'block';
            menu.style.top = (e.pageY - 60) + 'px';
            menu.style.left = (e.pageX - 20) + 'px';
            e.stopPropagation();
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (input.value.trim()) {
                document.getElementById('chat-content').appendChild(createMsgElement(input.value));
                input.value = "";
                scrollChat();
            }
        }

        function sendPhoto(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('chat-content').appendChild(createMsgElement(e.target.result, true));
                    scrollChat();
                };
                reader.readAsDataURL(file);
            }
        }

        function scrollChat() {
            const content = document.getElementById('chat-content');
            content.scrollTop = content.scrollHeight;
        }

        function deleteMsg() { if (targetMsg) targetMsg.remove(); hideMenu(); }
        function shareMsg() { if (navigator.share) navigator.share({ title: 'SURF MASTER', text: '情報をシェアします' }); hideMenu(); }
        function hideMenu() { document.getElementById('msg-context-menu').style.display = 'none'; }
        document.onclick = hideMenu;

        async function fetchSurf(lat, lon, id) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,marine=wave_height&timezone=Asia%2FTokyo`);
                const data = await res.json();
                const wave = data.current.wave_height || 0.4;
                document.getElementById(`w-val-${id}`).innerText = wave.toFixed(1);
                document.getElementById(`t-val-${id}`).innerText = Math.round(data.current.temperature_2m) + '°C';
            } catch (e) {}
        }

        function filterArea(area) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${area}`).classList.add('active');
            const container = document.getElementById('spot-container');
            container.innerHTML = '';

            surfSpots.filter(s => s.area === area).forEach((spot, i) => {
                const div = document.createElement('div');
                div.className = 'spot-card';
                div.innerHTML = `
                    <h3 class="text-2xl font-black italic text-sky-900 mb-6">${spot.name}</h3>
                    <div class="flex justify-between gap-4 mb-6">
                        <div class="bg-blue-50 border-2 border-blue-100 rounded-[25px] p-4 flex-1 text-center">
                            <p class="text-[11px] font-bold text-blue-500 mb-1">現在の波高</p>
                            <p class="text-3xl font-black text-sky-900"><span id="w-val-${i}">--</span><span class="text-sm ml-1">m</span></p>
                        </div>
                        <div class="bg-orange-50 border-2 border-orange-100 rounded-[25px] p-4 flex-1 text-center">
                            <p class="text-[11px] font-bold text-orange-500 mb-1">気温</p>
                            <p id="t-val-${i}" class="text-3xl font-black text-sky-900">--</p>
                        </div>
                    </div>
                    <div class="flex justify-between mb-6">
                        <a href="https://www.google.com/maps/search/${encodeURIComponent(spot.name + " サーフィン")}" target="_blank" class="bg-emerald-600 text-white w-[48%] py-3 rounded-xl text-center text-[10px] font-black uppercase">地図</a>
                        <a href="https://www.google.com/search?q=${encodeURIComponent(spot.q)}" target="_blank" class="bg-orange-50 text-orange-600 border border-orange-200 w-[48%] py-3 rounded-xl text-center text-[10px] font-black uppercase">天気</a>
                    </div>
                    <div class="bg-yellow-50/50 p-5 rounded-[25px] border border-yellow-100 text-sm">
                        <p class="mb-2"><span class="font-black text-sky-700 mr-2">P:</span>${spot.p}</p>
                        <p class="mb-2"><span class="font-black text-sky-700 mr-2">設備:</span>${spot.s} / ${spot.t}</p>
                        <p class="text-sky-800 font-bold bg-white p-2 rounded-lg border border-sky-50 text-xs">${spot.o}</p>
                    </div>
                `;
                container.appendChild(div);
                fetchSurf(spot.lat, spot.lon, i);
            });
        }

        function useGPS() {
            navigator.geolocation.getCurrentPosition((p) => {
                const la = p.coords.latitude;
                if(la > 35) filterArea('kyoto'); else if(la > 34.3) filterArea('osaka'); else if(la > 34.1) filterArea('wakayama'); else filterArea('mie');
            });
        }
        filterArea('wakayama');
    </script>
</body>
</html>
