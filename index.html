<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>サーフマスター PRO - 完全復旧版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;900&family=Permanent+Marker&display=swap');
        
        body { margin: 0; background: #f0f4f8; color: #1e293b; font-family: 'Noto Sans JP', sans-serif; }

        /* 背景画像：z-indexと背景固定で確実に表示 */
        .header-bg { 
            position: relative; height: 200px; width: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1502680399488-2a6574c50375?auto=format&fit=crop&w=1200&q=80'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 5px solid #3b82f6;
        }
        .header-title { font-family: 'Permanent Marker', cursive; font-size: 3rem; color: #fff; text-shadow: 2px 2px 15px rgba(0,0,0,0.7); }

        /* 通知スイッチ：画像に重ねず、掲示板エリアに配置 */
        .info-bar { background: #0f172a; color: #fff; display: flex; align-items: center; padding: 10px 15px; border-bottom: 2px solid #3b82f6; }
        .ticker-container { flex: 1; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 900; }
        .ticker-move { display: inline-block; padding-left: 100%; animation: ticker 25s linear infinite; color: #3b82f6; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .notif-control { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 900; border-left: 1px solid #334155; padding-left: 12px; }
        .switch { position: relative; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: #475569; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background: #fff; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: #3b82f6; }
        input:checked + .slider:before { transform: translateX(18px); }

        /* エリアナビ */
        .area-tabs { background: #fff; padding: 12px 0; border-bottom: 1px solid #cbd5e1; position: sticky; top: 0; z-index: 100; display: flex; overflow-x: auto; white-space: nowrap; }
        .tab-btn { padding: 8px 22px; margin: 0 6px; background: #f1f5f9; color: #475569; border-radius: 50px; font-size: 15px; font-weight: 900; }
        .tab-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }

        /* カードデザイン */
        .card { background: #fff; border-radius: 24px; padding: 20px; margin: 15px; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .data-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .data-chip { background: #f8fafc; padding: 12px; border-radius: 18px; text-align: center; border: 1px solid #f1f5f9; }
        
        .facility-list { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 18px; padding: 15px; margin-top: 15px; font-size: 13px; }
        .facility-item { display: flex; margin-bottom: 6px; font-weight: 900; color: #92400e; align-items: center; }
        .facility-item i { width: 24px; color: #d97706; font-size: 1rem; }

        /* ボトムナビ：全8ボタン */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 3px solid #3b82f6; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; padding: 10px 0; font-size: 10px; color: #64748b; font-weight: 900; }
    </style>
</head>
<body class="pb-48">

    <div class="header-bg">
        <h1 class="header-title">SURF MASTER</h1>
    </div>

    <div class="info-bar">
        <div class="ticker-container">
            <span id="ticker" class="ticker-move">最新情報を取得中... 各エリアの状況を確認してください。</span>
        </div>
        <div class="notif-control">
            <span>通知</span>
            <label class="switch"><input type="checkbox" id="notif-toggle" checked><span class="slider"></span></label>
        </div>
    </div>

    <div class="area-tabs">
        <button onclick="setArea('wakayama')" id="t-wakayama" class="tab-btn active">和歌山</button>
        <button onclick="setArea('mie')" id="t-mie" class="tab-btn">三重</button>
        <button onclick="setArea('kyoto')" id="t-kyoto" class="tab-btn">京都</button>
        <button onclick="setArea('osaka')" id="t-osaka" class="tab-btn">大阪</button>
    </div>

    <div id="content-area"></div>

    <nav class="bottom-nav">
        <button onclick="useGPS()" class="nav-btn text-blue-500"><i class="fas fa-crosshairs text-xl mb-1"></i><span>近く</span></button>
        <a href="https://www.google.com" target="_blank" class="nav-btn text-blue-600"><i class="fab fa-chrome text-xl mb-1"></i><span>ブラウザ</span></a>
        <button onclick="alert('トークルーム準備中')" class="nav-btn text-indigo-500"><i class="fas fa-comments text-xl mb-1"></i><span>トーク</span></button>
        <a href="https://nowphas.mlit.go.jp/" target="_blank" class="nav-btn text-orange-600"><i class="fas fa-broadcast-tower text-xl mb-1"></i><span>ナウファス</span></a>
        <a href="https://www.windy.com" target="_blank" class="nav-btn text-sky-400"><i class="fas fa-wind text-xl mb-1"></i><span>風情報</span></a>
        <a href="https://tide736.net" target="_blank" class="nav-btn text-cyan-500"><i class="fas fa-water text-xl mb-1"></i><span>潮見</span></a>
        <a href="https://www.google.co.jp/maps" target="_blank" class="nav-btn text-green-600"><i class="fas fa-map-marked-alt text-xl mb-1"></i><span>マップ</span></a>
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="nav-btn text-slate-400"><i class="fas fa-arrow-up text-xl mb-1"></i><span>TOP</span></button>
    </nav>

    <script>
        const allSpots = [
            // 和歌山(11)
            { a: 'wakayama', n: '磯ノ浦', lat: 34.2589, lon: 135.1054, p: 'あり(有料)', s: 'あり(温水)', t: 'あり', o: '関西随一のメッカ。' },
            { a: 'wakayama', n: '西磯', lat: 34.2595, lon: 135.0963, p: '磯ノ浦P利用', s: 'あり', t: 'あり', o: '中級者以上のリーフ。' },
            { a: 'wakayama', n: '奥磯', lat: 34.2605, lon: 135.1120, p: 'あり', s: 'あり', t: 'あり', o: '磯ノ浦の端。' },
            { a: 'wakayama', n: '浜の宮', lat: 34.1738, lon: 135.1882, p: 'あり', s: 'あり', t: 'あり', o: '遠浅なビーチ。' },
            { a: 'wakayama', n: '淡島', lat: 34.2750, lon: 135.0645, p: '周辺P', s: 'なし', t: 'あり', o: 'パワフルな波。' },
            { a: 'wakayama', n: 'ゴロゴロ', lat: 33.7225, lon: 135.3441, p: 'あり', s: 'あり', t: 'あり', o: '玉石ポイント。' },
            { a: 'wakayama', n: 'モーテル下', lat: 33.7188, lon: 135.3522, p: 'あり', s: 'あり', t: 'あり', o: '白浜周辺。' },
            { a: 'wakayama', n: '下里', lat: 33.5855, lon: 135.9185, p: 'あり', s: 'あり', t: 'あり', o: '美しい水質。' },
            { a: 'wakayama', n: '那智', lat: 33.6385, lon: 135.9392, p: 'あり', s: 'あり', t: 'あり', o: '道の駅隣接。' },
            { a: 'wakayama', n: 'フカ', lat: 33.5512, lon: 135.5015, p: '注意', s: 'なし', t: 'なし', o: '要技術。' },
            { a: 'wakayama', n: '印南', lat: 33.8210, lon: 135.2015, p: '注意', s: 'なし', t: 'あり', o: '漁船に注意。' },
            // 三重(5)
            { a: 'mie', n: '国府の浜', lat: 34.3325, lon: 136.9125, p: '多数あり', s: '完備', t: 'あり', o: '三重メインスポット。' },
            { a: 'mie', n: '市後浜', lat: 34.3215, lon: 136.9080, p: 'あり', s: 'あり', t: 'あり', o: 'キャンプ場併設。' },
            { a: 'mie', n: '阿児の松原', lat: 34.3380, lon: 136.9050, p: 'あり', s: 'あり', t: 'あり', o: '落ち着いたビーチ。' },
            { a: 'mie', n: '南張', lat: 34.2885, lon: 136.7562, p: 'あり', s: 'あり', t: 'あり', o: '上級者向け。' },
            { a: 'mie', n: 'ジャン', lat: 34.3100, lon: 136.8800, p: 'なし', s: 'なし', t: 'なし', o: '要リーフブーツ。' },
            // 京都(6)
            { a: 'kyoto', n: '八丁浜', lat: 35.6965, lon: 135.0515, p: 'あり', s: 'あり', t: 'あり', o: '丹後のメッカ。' },
            { a: 'kyoto', n: '夕日ヶ浦', lat: 35.6690, lon: 134.9250, p: 'あり', s: 'あり', t: 'あり', o: '景観抜群。' },
            { a: 'kyoto', n: '葛野浜', lat: 35.6420, lon: 134.9080, p: 'あり', s: 'あり', t: 'あり', o: 'ロングに人気。' },
            { a: 'kyoto', n: '小天橋', lat: 35.6312, lon: 134.8950, p: 'あり', s: 'あり', t: 'あり', o: '地形が安定。' },
            { a: 'kyoto', n: '神崎', lat: 35.5350, lon: 135.2420, p: 'あり', s: 'あり', t: 'あり', o: '舞鶴エリア。' },
            { a: 'kyoto', n: '平', lat: 35.7530, lon: 135.1580, p: 'あり', s: 'あり', t: 'あり', o: '静かなスポット。' },
            // 大阪(1)
            { a: 'osaka', n: 'せんなん里海', lat: 34.3435, lon: 135.1855, p: 'あり(大型)', s: 'あり', t: 'あり', o: '台風時限定。' }
        ];

        async function fetchWeather(lat, lon, id) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&daily=wave_height_max&timezone=Asia%2FTokyo`);
                const data = await res.json();
                document.getElementById(`w-${id}`).innerText = (data.daily.wave_height_max[0] || 0.5).toFixed(1) + 'm';
                document.getElementById(`t-${id}`).innerText = Math.round(data.current.temperature_2m) + '°C';
            } catch (e) {
                document.getElementById(`w-${id}`).innerText = '--m';
                document.getElementById(`t-${id}`).innerText = '--°C';
            }
        }

        function setArea(area) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`t-${area}`).classList.add('active');
            
            const tickerText = {
                wakayama: "【和歌山】磯ノ浦：ウネリ反応あり。浜の宮：スモールコンディション。",
                mie: "【三重】国府の浜：オフショアで良好。市後浜：落ち着いています。",
                kyoto: "【京都】八丁浜：北西の風あり。夕日ヶ浦：セットムネ。",
                osaka: "【大阪】せんなん里海：現在フラット。台風待ちです。"
            };
            document.getElementById('ticker').innerText = tickerText[area];
            
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            allSpots.filter(s => s.a === area).forEach((spot, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3 class="text-2xl font-black mb-4 text-slate-800">${spot.n}</h3>
                    <div class="data-row">
                        <div class="data-chip"><p class="text-[10px] text-blue-500 font-black">波高</p><p id="w-${i}" class="text-2xl font-black">--</p></div>
                        <div class="data-chip"><p class="text-[10px] text-orange-500 font-black">気温</p><p id="t-${i}" class="text-2xl font-black">--</p></div>
                    </div>
                    <div class="facility-list">
                        <div class="facility-item"><i class="fas fa-parking"></i> <span>駐車場:</span> <span class="ml-2 font-normal">${spot.p}</span></div>
                        <div class="facility-item"><i class="fas fa-shower"></i> <span>シャワー:</span> <span class="ml-2 font-normal">${spot.s}</span></div>
                        <div class="facility-item"><i class="fas fa-restroom"></i> <span>トイレ:</span> <span class="ml-2 font-normal">${spot.t}</span></div>
                        <p class="mt-4 pt-4 border-t border-amber-200 text-slate-600 italic text-[12px]">${spot.o}</p>
                    </div>
                    <div class="flex gap-2 mt-4">
                        <a href="https://www.google.com/search?q=${encodeURIComponent(spot.n + ' サーフィン 天気')}" target="_blank" class="flex-1 border-2 border-slate-200 text-slate-700 py-3 rounded-xl text-center text-xs font-black">詳細天気</a>
                        <a href="https://www.google.co.jp/maps/search/${encodeURIComponent(spot.n)}" target="_blank" class="flex-1 bg-slate-800 text-white py-3 rounded-xl text-center text-xs font-black">マップ</a>
                    </div>
                `;
                container.appendChild(card);
                fetchWeather(spot.lat, spot.lon, i);
            });
        }

        function useGPS() {
            navigator.geolocation.getCurrentPosition(p => {
                const la = p.coords.latitude;
                if(la > 35) setArea('kyoto'); else if(la > 34.3) setArea('osaka'); else if(la > 34.1) setArea('wakayama'); else setArea('mie');
            });
        }

        setArea('wakayama');
    </script>
</body>
</html>
